<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Public Pages</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f4f1ea;
      --panel: #fffaf0;
      --text: #222;
      --muted: #6f6b63;
      --accent: #df861c;
      --border: #9995;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #171717;
        --panel: #222;
        --text: #f3f3f3;
        --muted: #aaa;
        --accent: #f39a2e;
        --border: #9995;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, "Noto Sans JP", "Noto Sans", sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    main {
      max-width: 760px;
      margin: 0 auto;
      padding: 48px 20px;
    }
    h1 { margin: 0 0 8px; font-size: 30px; }
    p { color: var(--muted); margin: 0 0 28px; }
    .card {
      display: block;
      padding: 18px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--panel);
      color: inherit;
      text-decoration: none;
      box-shadow: 0 2px 10px #0001;
    }
    .card:hover { border-color: var(--accent); }
    .card h2 { margin: 0 0 6px; font-size: 19px; }
    .card span { color: var(--muted); font-size: 14px; }
  </style>
</head>
<body>
  <main>
    <h1>Public Pages</h1>
    <p>Small tools and pages.</p>

    <a class="card" href="./crossword/">
      <h2>Crossword Solver</h2>
      <span>Hidden crossword grid reconstruction tool</span>
    </a>
  </main>
</body>
</html>
